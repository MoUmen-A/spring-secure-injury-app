spring.application.name=InjurySystem

# ===============================
# THYMELEAF (optional tweak)
# ===============================
spring.thymeleaf.cache=false

# ===============================
# H2 DATABASE CONFIG
# ===============================
spring.datasource.url=jdbc:h2:file:./data/testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
# Show SQL in console (great for teaching)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# SESSION COOKIE HARDENING
# ===============================
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ===============================
# EMAIL CONFIG (set real SMTP details in local env)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-smtp-username
spring.mail.password=your-smtp-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.sender=no-reply@injurysystem.local
app.mail.receiver=clinic@example.com