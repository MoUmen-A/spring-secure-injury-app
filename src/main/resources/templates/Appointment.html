<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment</title>
    <link rel="stylesheet" th:href="@{/static/style.css}" href="/static/style.css"/>
</head>
<body>
<div class="container">
    <h1>Book an Appointment</h1>

    <form th:action="@{/appointments}" method="post">
        <div class="form-group">
            <label for="doctor">Choose Doctor</label>
            <select id="doctor" name="doctorId" required>
                <option value="" disabled
                        th:selected="${lastDoctorId == null}">-- Select a doctor --</option>
                <option th:each="doc : ${doctors}"
                        th:value="${doc.id}"
                        th:text="${doc.name}"
                        th:selected="${lastDoctorId != null and lastDoctorId == ${doc.id}.toString()}">
                    Dr. Example
                </option>
            </select>
        </div>

        <div class="form-group">
            <label for="date">Date</label>
            <input id="date" name="date" type="date" required
                   th:value="${lastDate}" />
        </div>

        <div class="form-group">
            <label for="time">Time</label>
            <input id="time" name="time" type="time" required
                   th:value="${lastTime}" />
        </div>

        <div class="form-actions">
            <button type="submit">Book Appointment</button>
            <a th:href="@{/dashboard}">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
