<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment</title>
    <link rel="stylesheet" th:href="@{/static/style.css}" href="/static/style.css"/>
</head>
<body>
<div class="container">
    <h1>Book an Appointment</h1>
    <p th:if="${error}" th:text="${error}" style="color: darkred;"></p>

    <p>
        Doctor:
        <strong th:text="${doctor.name}">Doctor Name</strong>
        -
        <span th:text="${doctor.specialty}">Specialty</span>
    </p>

    <form th:action="@{/appointments}" method="post">
        <input type="hidden" name="doctorId" th:value="${doctorId}">

        <div class="form-group">
            <label for="date">Date</label>
            <input id="date" name="date" type="date" required />
        </div>

        <div class="form-group">
            <label for="time">Time</label>
            <input id="time" name="time" type="time" required
                   th:value="${appointment != null ? appointment.time : '09:00'}" />
        </div>

        <div class="form-actions">
            <button type="submit">Book Appointment</button>
            <a th:href="@{/dashboard}">Cancel</a>
        </div>
    </form>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var date = document.getElementById('date');
            if (date) date.focus();
        });
    </script>
</div>
</body>
</html>
