<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment</title>
    <link rel="stylesheet" th:href="@{/static/style.css}" href="/static/style.css"/>
</head>
<body>
<div class="container">
    <h1>Book an Appointment</h1>

    <!--
      Expected model attributes provided by the controller:
      - ${doctors} : List of Doctor objects (each must expose id and name)
      - (optional) ${appointment} : prefilled appointment object if editing
    -->

    <form th:action="@{/appointments}" method="post">
        <div class="form-group">
            <label for="doctor">Choose Doctor</label>
            <select id="doctor" name="doctorId" required>
                <option value="" disabled selected>-- Select a doctor --</option>
                <option th:each="doc : ${doctors}"
                        th:value="${doc.id}"
                        th:text="${doc.name}">Dr. Example</option>
            </select>
        </div>

        <div class="form-group">
            <label for="date">Date</label>
            <input id="date" name="date" type="date" required
                   th:value="${appointment != null ? appointment.date : #dates.format(#dates.createNow(), 'yyyy-MM-dd')}" />
        </div>

        <div class="form-group">
            <label for="time">Time</label>
            <input id="time" name="time" type="time" required
                   th:value="${appointment != null ? appointment.time : '09:00'}" />
        </div>

        <div class="form-actions">
            <button type="submit">Book Appointment</button>
            <a th:href="@{/dashboard}">Cancel</a>
        </div>
    </form>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var sel = document.getElementById('doctor');
            if (sel) sel.focus();
        });
    </script>
</div>
</body>
</html>
