<!doctype html>
<html xmlns:ng="http://thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>selectInjury</title>
    </head>

    <body>
    <h2> Report Your Injury</h2>
    <form th:action="@{/injury/submit}" th:object="${injury}" method="post">

       <label>Body Part: </label>
        <select th:field="*{bodyPart}">
            <option th:each="part : ${bodyPart}" th:value="${part}" th:text="${part}"></option>
        </select><br/><br/><br/>

        <label>Injury Type: </label>
        <input type="text" th:field="*{type}" placeholder="Injury Type"><br/><br/><br/>

        <label>Can you move the affected area?</label>
        <div>
            <input type="radio" id="movableYes" th:field="*{movable}" th:value="true" />
            <label for="movableYes">Yes</label>

            <input type="radio" id="movableNo" th:field="*{movable}" th:value="false" />
            <label for="movableNo">No</label>
        </div><br/><br/>

        <label>Describe the symptoms: </label><br/>
        <textarea th:field="*{athleteDescription}"></textarea><br/><br/><br/>

        <button type="submit">Submit for Assessment</button>

        <h3 th:if="${assessmentResult}" th:text="${assessmentResult}" style="color: darkgreen;"></h3>

    </form>
    </body>
</html>
